[project]
name = "foxhunt"
version = "0.1.0"
description = "BBC micro:bit v2 Amateur Radio Direction Finding (ARDF) fox hunt game"
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "microfs>=1.4.5",
    "pyserial>=3.5",
]

# Usage counting for the published site. See ANALYTICS_PLAN.md for the design
# and web/src/analytics.js for exactly what is and is not sent.
#
# Empty endpoint = no beacon at all, and that is what a fork or a local build
# gets: `hosts` is a second, independent guard, so even a fork that keeps this
# configuration sends nothing, because it is served from a different host.
# Overridable consistently: --analytics-endpoint / --analytics-hosts on the
# command line beat $FOXHUNT_ANALYTICS_ENDPOINT / $FOXHUNT_ANALYTICS_HOSTS,
# which beat this file. --no-analytics builds with no beacon whatever is set.
[tool.foxhunt.analytics]
endpoint = "https://murdoch.is/stats/count"
hosts = ["sjmurdoch.github.io"]
# The counting lands in murdoch.is's own GoatCounter site, because the hunt is
# part of that personal site rather than a thing of its own. Every path this
# site reports goes under this namespace -- inside that site's real /projects/
# section, the hunt being one project among others -- so one dashboard filter
# separates the hunt from the site's own traffic in both directions.
prefix = "projects/radio-treasure-hunt"

[tool.pytest.ini_options]
# Only collect real unit tests. The hardware helpers (integration_check.py,
# calibrate.py) are run by hand and must never be collected as tests -- their
# module-level code would then run against whatever board happens to be
# attached. Importing one inside a test is fine: they define constants at
# import time and touch a port only from main().
testpaths = ["test_hound.py", "test_flash.py", "test_site.py"]
addopts = "-q"
