# Build the web flasher and publish it to GitHub Pages.
#
# The tests gate the deploy. That mirrors the rule the Makefile already applies
# to every flashing target: code that fails its tests must not reach a board.
# The web flasher is a flashing target, so it gets the same treatment.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The device-code stamp is the last commit to touch a device file,
          # which a shallow clone cannot find. Without this the site would be
          # stamped with the wrong version, or the build would stop.
          fetch-depth: 0

      # v7 rather than the newest release: setup-uv publishes no floating major
      # tag above v7, and v6 still runs on node20.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Tests
        run: make check

      - name: Build the site
        run: make site

      # v5 is the first that calls upload-artifact@v7; v4 still pinned v4.6.2,
      # which is one of the node20 actions the deprecation warning named.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
